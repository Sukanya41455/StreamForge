apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: streamforge
resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - kafka.yaml
  - api.yaml
  - producer.yaml
  - streaming.yaml
  - api-hpa.yaml
configMapGenerator:
  - name: postgres-init
    files:
      - init.sql=postgres-init.sql
generatorOptions:
  disableNameSuffixHash: true
