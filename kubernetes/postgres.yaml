apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: streamforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16.4-alpine
          env:
            - name: POSTGRES_DB
              value: streamforge
            - name: POSTGRES_USER
              value: streamforge
            - name: POSTGRES_PASSWORD
              value: streamforge
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: init-schema
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "streamforge", "-d", "streamforge"]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - name: init-schema
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: streamforge
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
