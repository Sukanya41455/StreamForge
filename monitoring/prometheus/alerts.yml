groups:
  - name: streamforge
    rules:
      - alert: KafkaConsumerLagHigh
        expr: sum(kafka_consumergroup_lag) > 10000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: StreamForge consumer lag is above 10,000 messages.
      - alert: ApiP95LatencyHigh
        expr: histogram_quantile(0.95, sum(rate(streamforge_http_request_duration_seconds_bucket[5m])) by (le)) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: StreamForge API p95 latency is above 500 ms.
